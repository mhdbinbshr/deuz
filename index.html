<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/png" href="https://ik.imagekit.io/dto1zguat/Logo.png?updatedAt=1775277696501" />
    <title>DEUZ & CO</title>
    <meta name="description" content="A premium international clothing brand crafted for those who move with purpose and presence. Blending cinematic aesthetics with luxury streetwear, every piece is designed with precision, bold storytelling, and elevated craftsmanship. Experience fashion that feels powerful, timeless, and globally inspired." />
    <meta property="og:title" content="DEUZ & CO" />
    <meta property="og:description" content="A premium international clothing brand crafted for those who move with purpose and presence. Blending cinematic aesthetics with luxury streetwear, every piece is designed with precision, bold storytelling, and elevated craftsmanship. Experience fashion that feels powerful, timeless, and globally inspired." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Manrope:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      
      /* Hide scrollbar for cleaner look in specific containers if needed */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Cinzel', 'serif'],
              sans: ['Manrope', 'sans-serif'],
            },
            colors: {
              gold: {
                400: '#D4AF37',
                500: '#C5A028',
                600: '#B08D23',
              },
              cinema: {
                black: '#050505',
                dark: '#0A0A0A',
                grey: '#1A1A1A',
              }
            },
            animation: {
              'spin-slow': 'spin 12s linear infinite',
            }
          }
        }
      }
    </script>
</head>
  <body class="bg-cinema-black text-white antialiased selection:bg-gold-500 selection:text-black overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
