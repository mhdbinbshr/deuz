    <style>
      html, body {
        background-color: #050505;
        color: #e5e5e5;
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;

      }
      #root {
        width: 100%;
        max-width: 100vw;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      img, video, canvas, svg {
        max-width: 100%;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      
      /* Hide scrollbar for cleaner look in specific containers if needed */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Sleek Atelier Gold Scrollbar for Modal and Panels */
      .gold-scrollbar::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      .gold-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
      }
      .gold-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(212, 175, 55, 0.35);
        border-radius: 9999px;
      }
      .gold-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(212, 175, 55, 0.65);
      }
      .gold-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: rgba(212, 175, 55, 0.35) transparent;
        -webkit-overflow-scrolling: touch;
      }

      /* Strict site-wide non-selectable & anti-copy enforcement */
      *, *::before, *::after {
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
        -webkit-touch-callout: none !important;
      }

      /* Allow user typing and caret interaction exclusively in input fields & textareas */
      input, textarea, [contenteditable="true"], select {
        -webkit-user-select: text !important;
        -moz-user-select: text !important;
        -ms-user-select: text !important;
        user-select: text !important;
      }

      /* Prevent image dragging across the application */
      img {
        -webkit-user-drag: none;
        user-drag: none;
        pointer-events: auto;
      }

      ::selection {
        background: transparent !important;
        color: inherit !important;
      }
      ::-moz-selection {
        background: transparent !important;
        color: inherit !important;
      }
    </style>
    <script>
      (function() {
        function isInput(el) {
          if (!el) return false;
          var tag = (el.tagName || '').toUpperCase();
          return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
        }

        // Prevent copying non-input text
        document.addEventListener('copy', function(e) {
          if (!isInput(document.activeElement)) {
            e.preventDefault();
            if (e.clipboardData) {
              e.clipboardData.clearData();
            }
          }
        }, true);

        // Prevent cutting non-input text
        document.addEventListener('cut', function(e) {
          if (!isInput(document.activeElement)) {
            e.preventDefault();
          }
        }, true);

        // Prevent text selection initiation on body/content
        document.addEventListener('selectstart', function(e) {
          if (!isInput(e.target)) {
            e.preventDefault();
            return false;
          }
        }, true);

        // Prevent dragging of imagery
        document.addEventListener('dragstart', function(e) {
          if (e.target && e.target.nodeName === 'IMG') {
            e.preventDefault();
            return false;
          }
        }, true);

        // Block copy keyboard shortcuts on non-inputs
        document.addEventListener('keydown', function(e) {
          if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
            if (!isInput(document.activeElement)) {
              e.preventDefault();
              return false;
            }
          }
        }, true);
      })();
    </script>
